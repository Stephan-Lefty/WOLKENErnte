<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="WOLKENErnte">
  <title>WOLKENErnte</title>
  <defs>
    <!-- userSpaceOnUse ist hier wesentlich, nicht Geschmackssache: Ohne die
         Angabe berechnet SVG den Verlauf für jedes Element neu über dessen
         eigene Bounding-Box. Bildkachel und Filmstreifen bekämen dann jeder
         einen eigenen Verlauf von hell nach dunkel und träfen die Farbe des
         Untergrunds an ihrer Stelle nicht. So dagegen greifen alle auf
         denselben Verlauf über die volle Fläche zu und passen exakt.

         Die beiden Farben sind BLAU_HELL und BLAU_TIEF aus farben.py und
         damit dieselben wie bei MailBurg. -->
    <linearGradient id="grund" gradientUnits="userSpaceOnUse"
                    x1="0" y1="0" x2="0" y2="512">
      <stop offset="0" stop-color="#0e8af6"/>
      <stop offset="1" stop-color="#0047a7"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="115" fill="url(#grund)"/>

  <!-- Die Wolke aus vier weißen Formen statt aus einem gerechneten Pfad.
       Weiß auf Weiß zeigt keine Nähte, dafür stimmt die Geometrie ohne
       Bogenkonstruktion: Die drei Kreise sitzen auf einer gemeinsamen
       Grundlinie bei y=303, das Rechteck schließt die Unterkante.

       Sie muss die breiteste Form im Bild sein - beide Kacheln liegen
       vollständig in ihr. Eine schmalere Wolke verschmilzt beim
       Verkleinern mit dem, was darunter steht. -->
  <g fill="#fff">
    <circle cx="175" cy="215" r="72"/>
    <circle cx="262" cy="170" r="102"/>
    <circle cx="350" cy="218" r="70"/>
    <rect x="103" y="215" width="317" height="88" rx="44"/>
  </g>

  <!-- Bild und Video liegen *in* der Wolke: Sie sind der Bestand, der
       dort oben lagert. Beide in der Farbe des Untergrunds, nicht als
       ausgespartes Loch - als Loch schiene der blaue Grund hindurch,
       was hier zufällig gleich aussähe, aber bei jeder späteren
       Änderung des Hintergrunds auseinanderfiele.

       Leicht gegeneinander gekippt, damit es nach Stapel aussieht und
       nicht nach Tabelle. -->
  <g transform="rotate(-8 198 247)">
    <rect x="136" y="200" width="124" height="94" rx="12" fill="url(#grund)"/>
    <!-- Ein Gipfel, nicht zwei. Zwei Zacken sind bei 32 Pixeln nicht
         mehr auseinanderzuhalten. -->
    <path d="M148 284 L190 232 L248 284 Z" fill="#fff"/>
    <circle cx="166" cy="224" r="12" fill="#fff"/>
  </g>

  <g transform="rotate(4 321 247)">
    <rect x="266" y="204" width="110" height="86" rx="11" fill="url(#grund)"/>
    <!-- Drei Löcher je Seite, nicht acht. Die Perforation ist das
         Erste, was beim Verkleinern verschwindet; je weniger und je
         größer die Löcher, desto länger bleibt der Filmstreifen als
         solcher erkennbar. -->
    <g fill="#fff">
      <rect x="280" y="212" width="14" height="11" rx="3"/>
      <rect x="312" y="212" width="14" height="11" rx="3"/>
      <rect x="344" y="212" width="14" height="11" rx="3"/>
      <rect x="280" y="271" width="14" height="11" rx="3"/>
      <rect x="312" y="271" width="14" height="11" rx="3"/>
      <rect x="344" y="271" width="14" height="11" rx="3"/>
    </g>
    <path d="M306 230 L306 264 L338 247 Z" fill="#fff"/>
  </g>

  <!-- Der Pfeil: die Ernte kommt herunter. Er beginnt in der Wolke und
       ist mit ihr eine Form - deshalb überlappt der Schaft die
       Wolkenunterkante um drei Einheiten statt sie zu berühren. Ein
       Spalt von einem Pixel wäre bei 32 Pixeln ein grauer Strich. -->
  <g fill="#fff">
    <rect x="236" y="300" width="44" height="82"/>
    <path d="M206 376 L310 376 L258 440 Z"/>
  </g>
</svg>
