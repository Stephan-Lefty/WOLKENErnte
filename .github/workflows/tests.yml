name: Tests

# **Seit das Repository öffentlich ist, kosten die Actions-Minuten
# nichts mehr.** Der Zuschnitt unten bleibt trotzdem.
#
# Denn der zweite Grund gilt weiter: Ein Durchlauf über drei
# Betriebssysteme bei jedem Push hieße mehrere Minuten Rechenzeit für
# jede geänderte Zeile, auch für die, die Windows nie zu sehen bekommt.
# Und die Rückmeldung wäre langsamer, nicht besser.
#
# Zur Erinnerung, falls dieses oder ein anderes Repository je wieder
# privat wird: GitHub rundet *jeden einzelnen Job* auf volle Minuten auf
# und rechnet macOS zehnfach, Windows zweifach. Ein macOS-Job von neun
# Sekunden zählt als zehn Minuten. Bei MailBurg summierte sich das an
# einem einzigen Arbeitstag auf 1.800 von 2.000 Minuten.
#
# Deshalb: Bei jedem Push *ein* Job auf Linux. Die anderen Systeme
# laufen einmal die Woche und wenn jemand sie ruft.

on:
  push:
    # An Text ändert sich durch einen Testlauf nichts.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
  pull_request:
  schedule:
    # Montags um 4 Uhr der breite Durchgang.
    - cron: "0 4 * * 1"
  workflow_dispatch:
    inputs:
      breit:
        description: "Auch Windows und macOS prüfen"
        type: boolean
        default: false

# Wer dreimal hintereinander pusht, braucht nur die Antwort auf den letzten.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Alles in einem Job. Nicht aus Ordnungsliebe, sondern wegen der
  # Aufrundung: fünf Jobs à fünfzehn Sekunden kosten fünf Minuten, einer
  # à siebzig Sekunden kostet zwei.
  linux:
    name: Linux (bei jedem Push)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Syntax prüfen
        run: python -m compileall -q wolkenernte tests

      - name: Tests
        run: python -m unittest discover -s tests -t . -v

      - name: Paket baut
        run: |
          python -m pip install --quiet build
          python -m build --wheel --outdir /tmp/rad

  breit:
    name: Windows und macOS (wöchentlich)
    # Der teure Durchgang. Läuft nur nach Zeitplan oder auf Zuruf -
    # niemals bei einem gewöhnlichen Push.
    if: github.event_name == 'schedule' || inputs.breit
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Tests
        run: python -m unittest discover -s tests -t .
